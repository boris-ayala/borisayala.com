<!doctype html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F4EC'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-family='Georgia,serif' font-size='22' fill='%2323395B'%3E%C2%A7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="identity">
      <a class="name" href="{{ '/' | relative_url }}">Boris Ayala</a>
      <div class="affiliation">Philosophy · Hunter College, CUNY</div>
    </div>
    <nav aria-label="Main" class="nav">
      {%- for item in site.nav %}
      {%- if page.url == item.url %}
      <a class="navlink" href="{{ item.url | relative_url }}" aria-current="page">{{ item.label }}</a>
      {%- else %}
      <a class="navlink" href="{{ item.url | relative_url }}">{{ item.label }}</a>
      {%- endif %}
      {%- endfor %}
    </nav>
  </header>
  <div class="rule" aria-hidden="true"></div>

  <main class="content">
{{ content }}
  </main>

  <div class="rule rule--soft" aria-hidden="true"></div>
  <footer class="footer">Department of Philosophy · Hunter College · New York City</footer>
</div>
</body>
</html>
